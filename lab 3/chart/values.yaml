owner: team-a
env: dev

api:
  replicas: 3
  image:
    repository: localhost:5001/shop-api
    tag: "1.0.4"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  probes:
    startup:
      path: /health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 30 
    readiness:
      path: /health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      path: /health
      port: 8080
      initialDelaySeconds: 15
      periodSeconds: 20
  env: []

worker:
  replicas: 2
  image:
    repository: localhost:5001/shop-worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  probes:
    startup:
      path: /health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 30 
    readiness:
      path: /health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      path: /health
      port: 8080
      initialDelaySeconds: 15
      periodSeconds: 20
  env:
    - name: POLL_INTERVAL
      value: "2s"
    - name: BATCH_SIZE
      value: "20"


postgres:
  image:
    repository: docker.io/library/postgres
    tag: "16-alpine"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  auth:
    username: postgres
    password: postgres
    database: shop