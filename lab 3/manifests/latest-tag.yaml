apiVersion: v1
kind: Pod
metadata:
  name: latest-tag
  labels:
    app.kubernetes.io/name: demo
    owner: team-a
    env: dev
spec:
  containers:
    - name: app
      image: registry.company.com/demo/app:latest
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits:   { cpu: "200m", memory: "256Mi" }
      readinessProbe:
        httpGet: { path: /healthz, port: 8080 }
      livenessProbe:
        httpGet: { path: /healthz, port: 8080 }