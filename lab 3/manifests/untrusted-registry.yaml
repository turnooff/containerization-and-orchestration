apiVersion: v1
kind: Pod
metadata:
  name: untrusted-registry
  labels:
    app.kubernetes.io/name: demo
    owner: team-a
    env: dev
spec:
  containers:
    - name: app
      image: quay.io/someorg/app:1.0.0
      resources:
        requests: { cpu: "100m", memory: "128Mi" }
        limits:   { cpu: "200m", memory: "256Mi" }
      readinessProbe:
        httpGet: { path: /healthz, port: 8080 }
      livenessProbe:
        httpGet: { path: /healthz, port: 8080 }