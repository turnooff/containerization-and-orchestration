# Часть 7/8: сначала prepare на обычном лёгком batch (порог ещё не включается).
# python3 "lab 4/memory-pressure.py" prepare
# helm upgrade shop "lab 4/chart" --kube-context kind-lab4 --namespace default --reset-values \
#   -f "lab 4/chart/values-memory-pressure.yaml" --wait --timeout 5m
# Затем включить мягкий порог и автоматически снять его после первого eviction:
# python3 "lab 4/memory-pressure.py" trigger
# После завершения trigger вернуть обычный Helm-профиль:
# helm upgrade shop "lab 4/chart" --kube-context kind-lab4 --namespace default --reset-values \
#   --wait --timeout 10m
# Аварийное восстановление порога: python3 "lab 4/memory-pressure.py" restore
batch:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: lab4-worker
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 2Gi
  probes:
    startup:
      path: /health
      port: 8080
      periodSeconds: 5
      failureThreshold: 60
  env:
    - name: CPU_WORKERS
      value: "1"
    - name: MEMORY_MIB
      value: "1280"
