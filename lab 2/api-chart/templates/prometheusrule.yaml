{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "api-chart.fullname" . }}
  labels:
    {{- include "api-chart.labels" . | nindent 4 }}
spec:
  groups:
    - name: api.rules
      interval: 30s
      rules:
        - alert: ApiLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{service="api", path="/health"}[5m])
              )
            ) > 0.02
          for: 5m
          labels:
            severity: warning
            service: api
          annotations:
            summary: "api /health p95 latency > 20ms"
            description: "p95 времени ответа /health превышает 20ms на протяжении 5 минут. Проверь дашборд RED и логи."

        - alert: ApiHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{service="api", status=~"5.."}[5m]))
              /
              sum(rate(http_requests_total{service="api"}[5m]))
            ) > 0.10
          for: 5m
          labels:
            severity: critical
            service: api
          annotations:
            summary: "api error rate > 10%"
            description: "Доля 5xx от общего числа запросов к api превысила 10% за последние 5 минут. Смотри графики и ищи причину в логах."

        - alert: ApiDown
          expr: up{job="api"} == 0
          for: 2m
          labels:
            severity: critical
            service: api
          annotations:
            summary: "api недоступен для scrape"
            description: "Prometheus не может скрейпить api более 2 минут. Проверь, жив ли под: kubectl get pods -n default."
{{- end }}