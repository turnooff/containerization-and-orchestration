{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "shop.fullname" . }}-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    release: monitoring
spec:
  groups:
    - name: shop.rules
      interval: 30s
      rules:
        - alert: ShopApiDown
          expr: |
            up{namespace="{{ .Release.Namespace }}", job=~".*shop-api.*"} == 0
            or
            absent(up{namespace="{{ .Release.Namespace }}", job=~".*shop-api.*"})
          for: 1m
          labels:
            severity: critical
            service: shop-api
          annotations:
            summary: "shop-api is down"
            description: "Prometheus cannot scrape shop-api for more than 1 minute (or the target has disappeared entirely)."

        - alert: ShopApiHighErrorRate
          expr: |
            (
              sum(rate(shop_api_http_requests_total{status=~"5.."}[5m]))
              /
              sum(rate(shop_api_http_requests_total[5m]))
            ) > 0.1
          for: 5m
          labels:
            severity: warning
            service: shop-api
          annotations:
            summary: "shop-api 5xx error rate > 10%"
            description: "More than 10% of shop-api requests returned 5xx in the last 5 minutes."

        - alert: ShopApiHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum by (le) (
                rate(shop_api_http_request_duration_seconds_bucket[5m])
              )
            ) > 0.5
          for: 5m
          labels:
            severity: warning
            service: shop-api
          annotations:
            summary: "shop-api p95 latency > 500ms"
            description: "95th percentile of shop-api request duration has exceeded 500ms for 5 minutes."
{{- end }}