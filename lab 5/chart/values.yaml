owner: team-a
env: dev

api:
  replicas: 3
  image:
    repository: localhost:5001/shop-api
    tag: "1.0.5"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    targetPort: 8080
    nodePort: 30000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  probes:
    startup:
      path: /health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 30 
    readiness:
      path: /health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      path: /health
      port: 8080
      initialDelaySeconds: 15
      periodSeconds: 20
  env: []

worker:
  replicas: 2
  image:
    repository: localhost:5001/shop-worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  probes:
    startup:
      path: /health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 30 
    readiness:
      path: /health
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      path: /health
      port: 8080
      initialDelaySeconds: 15
      periodSeconds: 20
  env:
    - name: POLL_INTERVAL
      value: "2s"
    - name: BATCH_SIZE
      value: "20"


postgres:
  instances: 1
  auth:
    username: shop
    password: shop
    database: shop
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

monitoring:
  enabled: true

networkPolicy:
  enabled: true

  api:
    ingressPort: 8080
  db:
    port: 5432
    clusterLabelKey: cnpg.io/cluster
    clusterLabelValue: shop-postgres
    allowedSourceComponents:
      - api
      - worker
  dns:
    namespaceLabelKey: kubernetes.io/metadata.name
    namespaceLabelValue: kube-system
    podLabelKey: k8s-app
    podLabelValue: kube-dns
    udpPort: 53
    tcpPort: 53